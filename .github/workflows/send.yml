name: Telegram scheduled messages

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Message slot
        required: true
        type: choice
        options: [09-00, 15-00, 19-00, 19-20, 19-30, 20-00]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select scheduled slot
        id: slot
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 21 * * *") value="09-00" ;;
              "0 3 * * *") value="15-00" ;;
              "0 7 * * *") value="19-00" ;;
              "20 7 * * *") value="19-20" ;;
              "30 7 * * *") value="19-30" ;;
              "0 8 * * *") value="20-00" ;;
              *) exit 1 ;;
            esac
            echo "value=$value" >> "$GITHUB_OUTPUT"
          fi
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Manual recovery runs also wait until the selected slot when started early.
          WAIT_FOR_SLOT: true
        run: node send.mjs "${{ steps.slot.outputs.value }}"
