name: Telegram scheduled messages

on:
  schedule:
    # GitHub cron uses UTC. Start three hours early because scheduled runs can be delayed.
    - cron: "0 21 * * *" # 06:00 KST -> send at 09:00 KST
    - cron: "0 3 * * *"  # 12:00 KST -> send at 15:00 KST
    - cron: "0 7 * * *"  # 16:00 KST -> send at 19:00 KST
    - cron: "20 7 * * *" # 16:20 KST -> send at 19:20 KST
    - cron: "30 7 * * *" # 16:30 KST -> send at 19:30 KST
    - cron: "0 8 * * *"  # 17:00 KST -> send at 20:00 KST
  workflow_dispatch:
    inputs:
      slot:
        description: Message slot
        required: true
        type: choice
        options: [09-00, 15-00, 19-00, 19-20, 19-30, 20-00]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select scheduled slot
        id: slot
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "value=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 21 * * *") value="09-00" ;;
              "0 3 * * *") value="15-00" ;;
              "0 7 * * *") value="19-00" ;;
              "20 7 * * *") value="19-20" ;;
              "30 7 * * *") value="19-30" ;;
              "0 8 * * *") value="20-00" ;;
              *) exit 1 ;;
            esac
            echo "value=$value" >> "$GITHUB_OUTPUT"
          fi
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WAIT_FOR_SLOT: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: node send.mjs "${{ steps.slot.outputs.value }}"
